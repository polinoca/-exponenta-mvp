name: Bootstrap Exponenta source

on:
  push:
    paths:
      - 'exponenta-mvp-production.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Exponenta source
        run: |
          test -f exponenta-mvp-production.zip || exit 0
          unzip -o exponenta-mvp-production.zip
          rm -f exponenta-mvp-production.zip
          rm -rf chunks
          rm -f exponenta-source.tar.gz.b64
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source
        run: |
          git config user.name "Exponenta Bootstrap"
          git config user.email "admin@exponenta.mx"
          git add -A
          git commit -m "Import Exponenta MVP source"
          git push
