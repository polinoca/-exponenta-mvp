name: Bootstrap Exponenta source

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        run: |
          cat chunks/part-* > /tmp/exponenta-source.tar.gz.b64
          base64 -d /tmp/exponenta-source.tar.gz.b64 > /tmp/exponenta-source.tar.gz
          tar -xzf /tmp/exponenta-source.tar.gz
          rm -rf chunks
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source
        run: |
          git config user.name "Exponenta Bootstrap"
          git config user.email "admin@exponenta.mx"
          git add -A
          git commit -m "Import Exponenta MVP source"
          git push
